<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .pane {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        #markdown-pane {
            border-right: 1px solid #ccc;
        }
        #markdown-input {
            width: 100%;
            height: 80%;
            resize: none;
            font-family: monospace;
            font-size: 16px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        #preview-pane {
            background: #f9f9f9;
        }
        #preview-content {
            font-size: 16px;
            line-height: 1.6;
        }
        .buttons {
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="markdown-pane" class="pane">
        <textarea id="markdown-input" placeholder="Type your Markdown here..."></textarea>
    </div>
    <div id="preview-pane" class="pane">
        <div id="preview-content"></div>
        <div class="buttons">
            <button onclick="exportToPDF()">Export</button>
            <button onclick="copyToClipboard()">Copy</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        const markdownInput = document.getElementById('markdown-input');
        const previewContent = document.getElementById('preview-content');

        // Real-time Markdown rendering
        markdownInput.addEventListener('input', () => {
            const markdownText = markdownInput.value;
            previewContent.innerHTML = marked.parse(markdownText);
        });

        // Export to PDF
        function exportToPDF() {
            const element = document.getElementById('preview-content');
            const opt = {
                margin: 1,
                filename: 'markdown_output.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        // Copy rich text to clipboard
        function copyToClipboard() {
            const range = document.createRange();
            range.selectNodeContents(previewContent);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('copy');
            selection.removeAllRanges();
            alert('Rich text copied to clipboard!');
        }
    </script>
</body>
</html>
